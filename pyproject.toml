[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flume"
version = "0.1.0"
description = "Stateless bridge: external webhooks -> AgentInbox events"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
flume = "flume.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
